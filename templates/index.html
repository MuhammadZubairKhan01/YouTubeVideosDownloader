<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #urlInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #urlInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #fetchBtn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #fetchBtn:hover {
            transform: translateY(-2px);
        }

        #fetchBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .video-info {
            display: none;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .video-info.active {
            display: block;
        }

        .video-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .thumbnail {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .video-details h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .video-meta {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .formats-section {
            margin-top: 20px;
        }

        .formats-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .format-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .format-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.2);
        }

        .format-info {
            flex: 1;
        }

        .format-quality {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .format-details {
            font-size: 13px;
            color: #666;
        }

        .download-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .progress-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .progress-section.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .status-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }

        .downloads-list {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .downloads-list h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .download-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .video-header {
                flex-direction: column;
            }

            .thumbnail {
                width: 100%;
                height: auto;
            }

            .input-section {
                flex-direction: column;
            }

            #fetchBtn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YouTube Video Downloader</h1>
        <p class="subtitle">Paste a YouTube URL and download in your preferred quality</p>

        <div class="error" id="errorBox"></div>

        <div class="input-section">
            <input 
                type="text" 
                id="urlInput" 
                placeholder="Paste YouTube video URL here..."
            >
            <button id="fetchBtn" onclick="fetchVideoInfo()">Fetch Video</button>
        </div>

        <div class="loading" id="loadingBox" style="display: none;">
            <div class="spinner"></div>
            <p>Fetching video information...</p>
        </div>

        <div class="video-info" id="videoInfo">
            <div class="video-header">
                <img src="" alt="Thumbnail" class="thumbnail" id="videoThumbnail">
                <div class="video-details">
                    <h2 id="videoTitle">Video Title</h2>
                    <div class="video-meta">
                        <div>Uploader: <span id="videoUploader"></span></div>
                        <div>Duration: <span id="videoDuration"></span></div>
                        <div>Views: <span id="videoViews"></span></div>
                    </div>
                </div>
            </div>

            <div class="formats-section">
                <h3>Available Formats</h3>
                <div id="formatsList"></div>
            </div>
        </div>

        <div class="progress-section" id="progressSection">
            <h3>Download Progress</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="status-text" id="statusText">Preparing download...</p>
        </div>

        <div class="downloads-list" id="downloadsList">
            <h3>Recent Downloads</h3>
            <div id="downloadsItems"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.classList.add('active');
            setTimeout(() => errorBox.classList.remove('active'), 5000);
        }

        function formatDuration(seconds) {
            if (!seconds) return 'Unknown';
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hrs > 0) {
                return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatViews(views) {
            if (!views) return '0';
            if (views >= 1000000) {
                return (views / 1000000).toFixed(1) + 'M';
            }
            if (views >= 1000) {
                return (views / 1000).toFixed(1) + 'K';
            }
            return views.toString();
        }

        async function fetchVideoInfo() {
            const url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                showError('Please enter a YouTube URL');
                return;
            }

            const fetchBtn = document.getElementById('fetchBtn');
            const loadingBox = document.getElementById('loadingBox');
            const videoInfo = document.getElementById('videoInfo');
            const progressSection = document.getElementById('progressSection');

            // Reset UI
            videoInfo.classList.remove('active');
            progressSection.classList.remove('active');
            document.getElementById('errorBox').classList.remove('active');
            
            // Show loading
            fetchBtn.disabled = true;
            loadingBox.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/api/info`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch video info');
                }

                // Display video info
                document.getElementById('videoThumbnail').src = data.thumbnail || '';
                document.getElementById('videoTitle').textContent = data.title;
                document.getElementById('videoUploader').textContent = data.uploader;
                document.getElementById('videoDuration').textContent = formatDuration(data.duration);
                document.getElementById('videoViews').textContent = formatViews(data.view_count);

                // Display formats
                const formatsList = document.getElementById('formatsList');
                formatsList.innerHTML = '';

                if (data.formats && data.formats.length > 0) {
                    data.formats.forEach(format => {
                        const formatItem = document.createElement('div');
                        formatItem.className = 'format-item';
                        formatItem.innerHTML = `
                            <div class="format-info">
                                <div class="format-quality">${format.resolution || 'Unknown'} - ${format.ext.toUpperCase()}</div>
                                <div class="format-details">
                                    Size: ${format.filesize_human} | 
                                    Type: ${format.format_type} | 
                                    Video: ${format.vcodec} | 
                                    Audio: ${format.acodec}
                                </div>
                            </div>
                            <button 
                                class="download-btn" 
                                onclick="downloadVideo('${url}', '${format.format_id}')"
                                ${!format.url ? 'disabled' : ''}
                            >
                                Download
                            </button>
                        `;
                        formatsList.appendChild(formatItem);
                    });
                } else {
                    formatsList.innerHTML = '<p>No downloadable formats found</p>';
                }

                videoInfo.classList.add('active');

            } catch (error) {
                showError(error.message);
            } finally {
                fetchBtn.disabled = false;
                loadingBox.style.display = 'none';
            }
        }

        async function downloadVideo(url, formatId) {
            const progressSection = document.getElementById('progressSection');
            const progressFill = document.getElementById('progressFill');
            const statusText = document.getElementById('statusText');

            progressSection.classList.add('active');
            progressFill.style.width = '30%';
            statusText.textContent = 'Starting download...';

            try {
                const response = await fetch(`${API_BASE}/api/download`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url, format_id: formatId })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Download failed');
                }

                progressFill.style.width = '100%';
                statusText.textContent = 'Download complete! Preparing file...';

                // Trigger file download
                setTimeout(() => {
                    window.location.href = `${API_BASE}/api/download-file/${encodeURIComponent(data.filename)}`;
                    statusText.textContent = 'File is downloading to your device...';
                    
                    // Update downloads list
                    updateDownloadsList();
                }, 1000);

            } catch (error) {
                showError(error.message);
                progressSection.classList.remove('active');
            }
        }

        async function updateDownloadsList() {
            try {
                const response = await fetch(`${API_BASE}/api/formats`);
                const files = await response.json();

                const downloadsItems = document.getElementById('downloadsItems');
                downloadsItems.innerHTML = '';

                if (files.length > 0) {
                    files.forEach(file => {
                        const item = document.createElement('div');
                        item.className = 'download-item';
                        item.innerHTML = `
                            <span>${file.filename}</span>
                            <div>
                                <span class="badge">${file.size}</span>
                                <a href="${file.download_url}" class="download-btn" style="margin-left: 10px; text-decoration: none; padding: 5px 10px; font-size: 12px;">Get</a>
                            </div>
                        `;
                        downloadsItems.appendChild(item);
                    });
                } else {
                    downloadsItems.innerHTML = '<p>No downloads yet</p>';
                }
            } catch (error) {
                console.error('Failed to update downloads list:', error);
            }
        }

        // Load downloads list on page load
        updateDownloadsList();

        // Allow Enter key to trigger fetch
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fetchVideoInfo();
            }
        });
    </script>
</body>
</html>
